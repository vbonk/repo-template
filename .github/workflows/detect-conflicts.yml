# Detect Merge Conflicts
# Auto-labels open PRs with `needs-rebase` when they have merge conflicts.
#
# Source-template maintenance only by default. GitHub template creation copies
# workflow files; derived repositories should not receive labels or scheduled
# maintenance side effects before Phase 0 decides whether this capability belongs.

name: Detect Merge Conflicts

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-conflicts:
    if: github.repository == 'vbonk/repo-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check PRs for merge conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create needs-rebase --repo "$REPO" \
            --color D93F0B --description "PR has merge conflicts and needs a rebase" \
            --force || echo "::warning::could not ensure needs-rebase label exists"

          check_prs() {
            gh pr list --repo "$REPO" --json number,mergeable,labels --state open
          }

          prs=$(check_prs)

          if printf '%s' "$prs" | jq -e '[.[] | select(.mergeable == "UNKNOWN")] | length > 0' > /dev/null; then
            echo "Some PRs have mergeable=UNKNOWN — waiting 20s for GitHub to compute"
            sleep 20
            prs=$(check_prs)
          fi

          printf '%s' "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(printf '%s' "$pr" | jq -r '.number')
            mergeable=$(printf '%s' "$pr" | jq -r '.mergeable')
            has_label=$(printf '%s' "$pr" | jq -r '[.labels[].name] | any(. == "needs-rebase")')

            if [ "$mergeable" = "CONFLICTING" ] && [ "$has_label" = "false" ]; then
              echo "PR #$number is conflicting — adding needs-rebase label"
              gh pr edit "$number" --repo "$REPO" --add-label needs-rebase \
                || echo "::warning::failed to label PR #$number — continuing"
            elif [ "$mergeable" = "MERGEABLE" ] && [ "$has_label" = "true" ]; then
              echo "PR #$number is mergeable — removing needs-rebase label"
              gh pr edit "$number" --repo "$REPO" --remove-label needs-rebase \
                || echo "::warning::failed to unlabel PR #$number — continuing"
            elif [ "$mergeable" = "UNKNOWN" ]; then
              echo "::warning::PR #$number mergeability still UNKNOWN — will resolve on next scheduled run"
            else
              echo "PR #$number — mergeable=$mergeable, has_label=$has_label — no action needed"
            fi
          done

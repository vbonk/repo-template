# Secret Scan — Detect potential secrets in PR diffs
# Scans changed files for API keys, private keys, credentials, and common secret patterns.
# Posts a warning comment if patterns are found (does not block merge — false positives happen).
#
# KNOWN LIMITATION: For PRs from forks, the pull_request event runs with read-only
# permissions — this workflow cannot post comments on fork PRs. GitHub's built-in
# push protection covers this gap server-side for public repos.

name: Secret Scan PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan PR diff for secrets
        id: scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "--- Scanning PR diff for secret patterns ---"

          # Get changed files in this PR (using env var, not direct interpolation)
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- \
            ':!*.lock' ':!*-lock.*' ':!*.sum' \
            ':!*.png' ':!*.jpg' ':!*.gif' ':!*.ico' ':!*.svg' \
            ':!*.woff' ':!*.woff2' ':!*.pdf' \
            ':!*.example' ':!*.template' \
            2>/dev/null || true)

          if [ -z "$CHANGED" ]; then
            echo "No relevant files changed."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Secret patterns (POSIX-compatible — uses [[:space:]] not \s).
          # All patterns here are high-precision provider tokens, so .md/.txt
          # files are scanned too (prose can leak real keys; these prefixes
          # don't false-positive on normal text).
          # Format: "Label|regex" — one per line.
          PATTERN_LIST='AWS access key|AKIA[A-Z0-9]{16}
          GitHub classic token|gh[pos]_[a-zA-Z0-9]{36}
          GitHub fine-grained PAT|github_pat_[A-Za-z0-9_]{22,}
          GitHub user/refresh token|gh[ur]_[A-Za-z0-9]{36,}
          Anthropic API key|sk-ant-[a-zA-Z0-9-]+
          OpenAI project key|sk-proj-[a-zA-Z0-9]+
          Stripe live key|sk_live_[0-9a-zA-Z]{24,}
          Slack token|xox[baprs]-[A-Za-z0-9-]{10,}
          Google API key|AIza[0-9A-Za-z_-]{35}
          npm token|npm_[A-Za-z0-9]{36}
          JWT|eyJ[A-Za-z0-9_-]{20,}\.eyJ
          Private key block|-----BEGIN[[:space:]]+(RSA[[:space:]]+|EC[[:space:]]+|OPENSSH[[:space:]]+)?PRIVATE[[:space:]]+KEY'

          # SECURITY: never place matched content in findings — a captured
          # secret pasted into a PR comment is a secondary leak (comments are
          # durable and bot-authored). Report file:line + pattern label ONLY.
          # Displayed filenames are sanitized (they are PR-author-controlled).
          FINDINGS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            SAFE_NAME=$(printf '%s' "$file" | tr -cd 'A-Za-z0-9._/-')

            while IFS='|' read -r label regex; do
              label=$(printf '%s' "$label" | sed 's/^[[:space:]]*//')
              [ -z "$regex" ] && continue
              # -e guards against regexes that start with '-' (private-key pattern)
              LINES=$(grep -nE -e "$regex" "$file" 2>/dev/null | cut -d: -f1 | tr '\n' ',' | sed 's/,$//')
              if [ -n "$LINES" ]; then
                FINDINGS="${FINDINGS}- \`${SAFE_NAME}\` line(s) ${LINES} — ${label}\n"
              fi
            done <<< "$PATTERN_LIST"
          done <<< "$CHANGED"

          if [ -n "$FINDINGS" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo -e "$FINDINGS" > /tmp/secret-findings.txt
            echo "::warning::Potential secrets detected in PR diff"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No secret patterns found."
          fi

      # continue-on-error: fork PRs run with a read-only token and this step
      # 403s — that is the documented limitation, not a scan failure, so it
      # must not paint a red X on exactly the PRs that most need the scan.
      - name: Post warning comment
        if: steps.scan.outputs.found == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const findings = fs.readFileSync('/tmp/secret-findings.txt', 'utf8');
            const body = [
              '## :warning: Potential Secrets Detected',
              '',
              'These locations matched secret patterns (matched content is deliberately NOT shown — check the lines locally):',
              '',
              findings,
              '',
              '**Please verify these are not real secrets before merging.**',
              '',
              'If these are false positives (example values, documentation), you can safely ignore this.',
              '',
              'If real secrets were committed:',
              '1. **Do NOT merge this PR**',
              '2. Rotate the exposed credential immediately',
              '3. Remove the secret from your branch',
              '4. See [SECURITY.md](../blob/main/SECURITY.md) for incident response steps'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
